# Win64 Development playtest release (#78, #130). Runs only on the maintainer's self-hosted runner, which is switched
# on and off by hand (Scripts/CIRunner.ps1). A run queued while the runner is off waits up to 24 hours.
# The runner's job-started hook refuses every event except schedule and workflow_dispatch on this repository.
#
# Each run on main that has a commit without a vX.Y.Z tag:
#   1. Scripts/CIReleaseVersion.py picks the version (patch after the latest tag, or an untagged newer ini version);
#      when Config/DefaultGame.ini needs it, a version commit is pushed to main (fast-forward only) before packaging,
#      so the package, its manifest and main agree. Pushing needs the GitHub Actions app on the main ruleset's
#      bypass list.
#   2. Build, rule tests and package that commit.
#   3. Publish Release vX.Y.Z with the zipped package (GitHub creates the tag on publish), then delete all but the two
#      newest vX.Y.Z Releases. Their tags stay.
# With nothing new on main the run stops after checkout; a manual run with `force` releases the next patch anyway.
name: Nightly playtest package

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      force:
        description: 'Release the next patch even when main has no new commit since the last release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-package
  cancel-in-progress: false

env:
  KEEP_RELEASES: 2

jobs:
  package:
    if: github.repository == 'rlsn/Lockdown-alpha'
    runs-on: [self-hosted, Windows, X64, lockdown-ue58]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: throw "Playtest releases are cut from main only; this run is on $env:GITHUB_REF."

      - name: Check out
        uses: actions/checkout@v7
        with:
          # main's tip when the job starts, not the commit that queued it: a re-run, or a schedule that waited for the
          # runner, releases current main and can fast-forward its version commit.
          ref: refs/heads/main
          lfs: true
          # Keep ignored build output (Binaries, Intermediate) so the build is incremental.
          clean: false

      - name: Choose version
        id: version
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          git fetch --force --tags --quiet origin
          if ($LASTEXITCODE -ne 0) { throw 'Fetching tags failed.' }
          $plan = @{}
          foreach ($line in (python -B ./Scripts/CIReleaseVersion.py plan)) { $key, $value = $line -split '=', 2; $plan[$key] = $value }
          if ($LASTEXITCODE -ne 0 -or -not $plan.version) { throw 'CIReleaseVersion.py plan failed.' }
          $skip = $plan.released -eq 'true' -and $env:FORCE -ne 'true'
          if ($skip) {
            "main is still $(git rev-parse HEAD), already released as $(git tag --points-at HEAD). Nothing to do." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version=$($plan.version)" >> $env:GITHUB_OUTPUT
          "bump=$($plan.bump)" >> $env:GITHUB_OUTPUT

      - name: Reset workspace
        if: steps.version.outputs.skip != 'true'
        run: ./Scripts/CIResetWorkspace.ps1

      - name: Commit version
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -B ./Scripts/CIReleaseVersion.py apply --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'CIReleaseVersion.py apply failed.' }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --quiet -m "chore: bump version to $env:VERSION" -- Config/DefaultGame.ini
          if ($LASTEXITCODE -ne 0) { throw 'Committing the version failed.' }
          git push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Pushing the version commit to main failed. Either main moved during this run (run it again; it checks out the new tip) or the GitHub Actions app is not on the main ruleset bypass list.'
          }
          "Version commit $(git rev-parse --short HEAD) sets ProjectVersion=$env:VERSION on main." >> $env:GITHUB_STEP_SUMMARY

      - name: Preflight
        if: steps.version.outputs.skip != 'true'
        run: ./Scripts/Preflight.ps1

      - name: Build editor
        if: steps.version.outputs.skip != 'true'
        run: ./Scripts/BuildEditor.ps1

      - name: Rule tests
        if: steps.version.outputs.skip != 'true'
        run: ./Scripts/RunTests.ps1

      - name: Package Win64
        if: steps.version.outputs.skip != 'true'
        run: ./Scripts/PackageWin64.ps1

      - name: Add launch notes and zip
        id: notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $output = @(Get-ChildItem Artifacts -Directory -Filter '*-PackageWin64' | Sort-Object Name)[-1]
          if (-not $output) { throw 'PackageWin64 produced no output directory.' }
          $manifest = Get-Content (Join-Path $output.FullName 'PackageManifest.json') -Raw | ConvertFrom-Json
          $head = git rev-parse HEAD
          if ($manifest.sourceRevision -ne $head) { throw "Package manifest revision $($manifest.sourceRevision) is not $head." }
          if ($manifest.sourceDirty) { throw 'The package was built from a dirty workspace.' }
          if ($manifest.productVersion -ne $env:VERSION) { throw "Package version $($manifest.productVersion) is not $env:VERSION." }
          $short = $head.Substring(0, 7)
          $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = Join-Path $output.FullName 'README.txt'
          @(
            "Lockdown 试玩包 $env:VERSION · $short · $date (UTC)"
            "Win64 Development 构建，由每日打包工作流生成：$runUrl"
            '所有玩家需使用同一版本的包，版本不同无法加入房间。'
            ''
            '启动'
            '1. 解压整个压缩包，不要只拷出 exe。'
            '2. 运行 Archive\Windows\Lockdown.exe，进入主菜单并设置名称。'
            '3. 一人点“创建房间”当房主；其他人点“加入房间”，填写房主 IP 与端口。'
            '   首次建房时 Windows 防火墙会询问，需允许访问；跨网络需自行开放防火墙并设置端口映射。'
            '4. 用仓库脚本启动时会校验清单：.\Scripts\OpenPackaged.ps1 -PackageRoot ''<解压目录>\Archive'''
            '5. 测试模式：房主给 Lockdown.exe 加 -LDDevGrowthFixture（或 OpenPackaged.ps1 加 -DevTest）启动；对局中点底部“测试”按钮打开面板，'
            '   或按 ~ 打开控制台，'
            '   输入 ld.Dev.List 查看 id；ld.Dev.XP/Gold <数量>、ld.Dev.Learn <id> [Q|W]、ld.Dev.Buy <id>、ld.Dev.Sell <1|2>、'
            '   ld.Dev.Refill、ld.Dev.ResetCooldowns、ld.Dev.Attr <属性> <数值>、ld.Dev.ClearAttr、ld.Dev.Reset，只作用于自己。'
            '   房主另可用 ld.Dev.RefreshCamps 刷新已清空营地、ld.Dev.OpenCapture 在发育期提前开圈。测试模式的结果不算无作弊对局。'
            ''
            '说明'
            '- 本包在规则测试（RunTests.ps1）通过后打包；未在此包上运行任何 RunDemo*Check 场景。'
            '- 打包成功不代表 Demo 验收通过，验收状态见 docs/demo/READINESS.md。'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          $zip = Join-Path (Resolve-Path Artifacts) "Lockdown-v$env:VERSION-win64.zip"
          $entries = @(Get-ChildItem -LiteralPath $output.FullName -Name)
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip -C $output.FullName @entries
          if ($LASTEXITCODE -ne 0) { throw "Zipping the package failed: $zip" }
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$head" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.notes }}
          ZIP: ${{ steps.notes.outputs.zip }}
          SHA: ${{ steps.notes.outputs.sha }}
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw 'GitHub CLI (gh) is not on the runner PATH.' }
          $tag = "v$env:VERSION"
          # A failed upload leaves only a draft (GitHub creates the tag when a release is published); clear it first.
          $existing = gh release view $tag --json isDraft 2>$null | ConvertFrom-Json
          if ($existing) {
            if (-not $existing.isDraft) { throw "Release $tag is already published." }
            gh release delete $tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Deleting the leftover draft $tag failed." }
          }
          gh release create $tag $env:ZIP --target $env:SHA --title "Lockdown $env:VERSION" --notes-file $env:NOTES --latest
          if ($LASTEXITCODE -ne 0) { throw "Publishing release $tag failed." }
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          "Released **$tag** at ``$($env:SHA.Substring(0, 7))``: $url" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep the newest releases
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releases = @(gh release list --limit 100 --exclude-drafts --json tagName | ConvertFrom-Json |
            Where-Object { $_.tagName -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.tagName.Substring(1) } -Descending)
          if ($LASTEXITCODE -ne 0) { throw 'Listing releases failed.' }
          foreach ($old in ($releases | Select-Object -Skip ([int]$env:KEEP_RELEASES))) {
            # Without --cleanup-tag the tag stays.
            gh release delete $old.tagName --yes
            if ($LASTEXITCODE -ne 0) { throw "Deleting old release $($old.tagName) failed." }
            "Deleted old release $($old.tagName) (tag kept)." >> $env:GITHUB_STEP_SUMMARY
          }
