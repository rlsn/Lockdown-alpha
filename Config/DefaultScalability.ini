; Texture streaming pool per texture quality. The match needs about 1.25 GB of streamed mips at the top tier; every tier
; is capped by the card's free video memory (LimitPoolSizeToVRAM) so a small card is never asked for more than it has.
[TextureQuality@0]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=800

[TextureQuality@1]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1200

[TextureQuality@2]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=1600

[TextureQuality@3]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=2000

[TextureQuality@Cine]
r.Streaming.LimitPoolSizeToVRAM=1
r.Streaming.PoolSize=3000
