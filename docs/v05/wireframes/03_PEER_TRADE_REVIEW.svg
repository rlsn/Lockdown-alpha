<text x="524" y="537" fill="#b2c7d7" font-family="Segoe UI,Arial,sans-serif" font-size="17">Your final bag must fit 24 slots / one Seal.</text>
<text x="524" y="596" fill="#ffd283" font-family="Segoe UI,Arial,sans-serif" font-size="19">Any change clears both approvals.</text>
<text x="524" y="634" fill="#b2c7d7" font-family="Segoe UI,Arial,sans-serif" font-size="18">Neither side transfers until both confirm.</text>
