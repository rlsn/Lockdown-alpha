<text x="1050" y="583" fill="#ffd283" font-family="Segoe UI,Arial,sans-serif" font-size="19">Their final confirmation: pending</text>
<text x="1050" y="672" fill="#b2c7d7" font-family="Segoe UI,Arial,sans-serif" font-size="18">Edit returns both sides to offer review.</text>
